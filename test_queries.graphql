# users

# Register (public)

mutation Register {
  register(input: {
    email: "alice@example.com"
    password: "secret123"
    displayName: "Alice"
  }) {
    token
    user { id email displayName createdAt }
  }
}


# Login (public)

mutation Login {
  login(input: { email: "alice@example.com", password: "secret123" }) {
    token
    user { id email displayName }
  }
}


# Me (auth required)

query Me {
  me {
    id
    email
    displayName
    createdAt
    posts { id title }
  }
}

# Get user by id (public)

query GetUser {
  user(id: "PASTE_USER_ID") {
    id
    email
    displayName
    posts { id title createdAt }
  }
}


# Get List of Users (public)

query list_of_users {
  users{
    id
    email
    displayName
    createdAt
  }
}


# Update profile (auth required)


mutation UpdateProfile {
  updateProfile(input: { displayName: "Alice Updated" }) {
    id
    displayName
    updatedAt
  }
}



# Posts

# List posts (public)

query Posts {
  posts(limit: 20) {
    id
    title
    body
    createdAt
    author { id displayName }
    comments { id body }
  }
}


# Single post (public)

query Post {
  post(id: "PASTE_POST_ID") {
    id
    title
    body
    createdAt
    updatedAt
    author { id displayName email }
    comments {
      id
      body
      createdAt
      author { id displayName }
    }
  }
}




