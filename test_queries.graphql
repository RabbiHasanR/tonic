# Create post (auth required)

mutation CreatePost {
  createPost(input: {
    title: "My first post"
    body: "Hello world from GraphQL!"
  }) {
    id
    title
    body
    createdAt
    author { id displayName }
  }
}


# Update post (auth required, owner only)

mutation UpdatePost {
  updatePost(input: {
    id: "PASTE_POST_ID"
    title: "Updated title"
    body: "Updated body"
  }) {
    id
    title
    body
    updatedAt
  }
}


# Delete post (auth required, owner only)

mutation DeletePost {
  deletePost(id: "PASTE_POST_ID")
}


# Comments

# Comments are read via Post.comments (no root query). Mutations require auth.

# Create comment (auth required)

mutation CreateComment {
  createComment(input: {
    postId: "PASTE_POST_ID"
    body: "Nice post!"
  }) {
    id
    body
    createdAt
    author { id displayName }
  }
}


# Update comment (auth required, owner only)

mutation UpdateComment {
  updateComment(input: {
    id: "PASTE_COMMENT_ID"
    body: "Edited comment body"
  }) {
    id
    body
    updatedAt
  }
}


# Delete comment (auth required, owner only)

mutation DeleteComment {
  deleteComment(id: "PASTE_COMMENT_ID")
}


# Health check

query Ping {
  ping
}
