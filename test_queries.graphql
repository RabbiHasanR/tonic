# users

# Register (public)

mutation Register {
  register(input: {
    email: "alice@example.com"
    password: "secret123"
    displayName: "Alice"
  }) {
    token
    user { id email displayName createdAt }
  }
}


# Login (public)

mutation Login {
  login(input: { email: "alice@example.com", password: "secret123" }) {
    token
    user { id email displayName }
  }
}


# Me (auth required)

query Me {
  me {
    id
    email
    displayName
    createdAt
    posts(first: 5) {
      totalCount
      pageInfo { hasNextPage endCursor }
      edges { cursor node { id title } }
    }
  }
}

# Get user by id (public)

query GetUser {
  user(id: "PASTE_USER_ID") {
    id
    email
    displayName
    posts(first: 10) {
      totalCount
      pageInfo { hasNextPage hasPreviousPage startCursor endCursor }
      edges { cursor node { id title createdAt } }
    }
  }
}

# Next page of a user's posts (forward, after endCursor from GetUser)

query GetUserPostsNextPage {
  user(id: "PASTE_USER_ID") {
    id
    posts(first: 10, after: "PASTE_END_CURSOR") {
      pageInfo { hasNextPage endCursor }
      edges { cursor node { id title createdAt } }
    }
  }
}

# Users list — first 3 posts per user (top-N preview pattern)

query UsersWithPostPreview {
  users {
    id
    displayName
    posts(first: 3) {
      totalCount
      edges { cursor node { id title } }
    }
  }
}


# Get List of Users (public)

query list_of_users {
  users{
    id
    email
    displayName
    createdAt
  }
}


# Update profile (auth required)


mutation UpdateProfile {
  updateProfile(input: { displayName: "Alice Updated" }) {
    id
    displayName
    updatedAt
  }
}



# Posts

# List posts — Relay connection (public)

# First page (forward, no cursor)
query PostsFirstPage {
  posts(first: 5) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        title
        body
        createdAt
        author { id displayName }
        comments { id body }
      }
    }
  }
}

# Next page (forward, after the previous endCursor)
query PostsNextPage {
  posts(first: 5, after: "PASTE_END_CURSOR") {
    totalCount
    pageInfo { hasNextPage hasPreviousPage startCursor endCursor }
    edges {
      cursor
      node { id title createdAt author { id displayName } }
    }
  }
}

# Previous page (backward, before the current startCursor)
query PostsPrevPage {
  posts(last: 5, before: "PASTE_START_CURSOR") {
    totalCount
    pageInfo { hasNextPage hasPreviousPage startCursor endCursor }
    edges {
      cursor
      node { id title createdAt author { id displayName } }
    }
  }
}

# Last page (backward, no cursor — newest cursor walk from the tail)
query PostsLastPage {
  posts(last: 5) {
    totalCount
    pageInfo { hasNextPage hasPreviousPage startCursor endCursor }
    edges { cursor node { id title createdAt } }
  }
}

# Validation: should return a GraphQL error
# ("Pass either `first` or `last`, not both")
query PostsInvalidBoth {
  posts(first: 5, last: 5) {
    totalCount
    edges { cursor node { id } }
  }
}

# Validation: should return a GraphQL error
# ("`after` can only be combined with `first`")
query PostsInvalidMix {
  posts(last: 5, after: "PASTE_ANY_CURSOR") {
    edges { cursor node { id } }
  }
}

# Validation: should return a GraphQL error ("Invalid cursor")
query PostsInvalidCursor {
  posts(first: 5, after: "not-a-real-cursor") {
    edges { cursor node { id } }
  }
}


# Single post (public)

query Post {
  post(id: "PASTE_POST_ID") {
    id
    title
    body
    createdAt
    updatedAt
    author { id displayName email }
    comments {
      id
      body
      createdAt
      author { id displayName }
    }
  }
}




