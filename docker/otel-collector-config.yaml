# OpenTelemetry Collector — Phase 1 pipeline.
# Receives OTLP from the app (gRPC 4317, HTTP 4318), batches spans,
# forwards them to Jaeger over OTLP/gRPC.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
